name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    name: Quality Gate | Core
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7

      - name : Checkout code
        uses: actions/checkout@v4

      - name: Setup Lint
        run: make setup-lint

      - name: Run terraform-docs manually
        run: |
          command -v mise >/dev/null 2>&1 || curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install terraform-docs
          for dir in modules/*/; do
            echo "=== ${dir} ==="
            mise exec -- terraform-docs markdown table \
              --output-file=README.md \
              --output-mode=inject \
              "${dir}"
          done
          echo "=== git diff after terraform-docs run ==="
          git diff -- modules/

      # - uses: 24dlong/github-actions-library/actions/quality-gate@v3
